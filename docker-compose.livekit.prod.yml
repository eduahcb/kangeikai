# Production LiveKit deploy — Coolify "Docker Compose" resource (NOT "Docker Image": that
# resource type's Port Mappings field doesn't support UDP, see
# https://github.com/coollabsio/coolify/discussions/1014 — WebRTC media needs a UDP range).
#
# NODE_IP/LIVEKIT_KEYS are supplied as environment variables on the Coolify resource itself,
# not committed here. NODE_IP is the host's real public IP (advertised to WebRTC peers for ICE
# candidates); LIVEKIT_KEYS is "key: secret" (generate a real pair for production — never reuse
# docker-compose.livekit.yml's dev-only fixed "devkey"/"secret").
#
# Verified against the real image (v1.13.5): with no --bind flag, it already listens on all
# interfaces inside the container, and its default RTC ICE port range (50000-60000) is used
# below rather than overriding it.
services:
  livekit:
    image: livekit/livekit-server:v1.13.5
    restart: unless-stopped
    environment:
      NODE_IP: ${NODE_IP}
      LIVEKIT_KEYS: ${LIVEKIT_KEYS}
    ports:
      - '7880:7880' # HTTP + WebSocket signaling (routed through Coolify's proxy/domain)
      - '7881:7881/tcp' # WebRTC over TCP (fallback) — direct host exposure, bypasses the proxy
      - '50000-60000:50000-60000/udp' # WebRTC over UDP (LiveKit's default ICE range)
